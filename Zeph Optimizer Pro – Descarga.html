html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;text-align:center}
h1{font-size:1.7rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px;line-height:1.5}
.step{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;text-align:left}
.step b{display:block;margin-bottom:10px}
.step.off{opacity:.45;pointer-events:none}
.btn{display:block;width:100%;padding:13px 16px;border-radius:12px;border:0;font-size:1rem;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;color:#fff}
.yt{background:var(--red)}
.dl{background:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
